<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Soulcool Nails 测试版</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f7f4f6;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif}.test-badge{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#241f23;color:#fff;font-size:12px;font-weight:800;letter-spacing:.7px;line-height:1.45}.test-badge span{opacity:.95}.last-sync{font-size:11px;font-weight:600;letter-spacing:0;opacity:.82}iframe{border:0;width:100%;height:calc(100vh - 48px);display:block;background:#f7f4f6}
</style>
</head>
<body>
<div class="test-badge"><span>SOULCOOL NAILS · TEST VERSION · 测试版</span><div class="last-sync" id="lastSync">最后同步：尚未同步</div></div>
<iframe id="appFrame" src="index.html"></iframe>
<script>
const frame=document.getElementById('appFrame');
const lastSync=document.getElementById('lastSync');
function stampSync(){
  lastSync.textContent='最后同步：'+new Date().toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'});
}
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const status=doc&&doc.getElementById('summaryStatus');
    const btn=doc&&doc.getElementById('loadMainBtn');
    if(status){
      const check=()=>{if((status.textContent||'').includes('已从 Soulcool 主数据同步'))stampSync()};
      check();
      new MutationObserver(check).observe(status,{childList:true,subtree:true,characterData:true});
    }
    if(btn){
      btn.addEventListener('click',()=>{
        setTimeout(()=>{
          try{if((status?.textContent||'').includes('已从 Soulcool 主数据同步'))stampSync()}catch(e){}
        },1200);
      });
    }
  }catch(e){}
});
</script>
</body>
</html>
