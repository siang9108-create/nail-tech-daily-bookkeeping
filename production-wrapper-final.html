<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>美甲师每日记账</title><style>html,body{margin:0;width:100%;height:100%;background:#f7f4f6}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="./base.html?v=production-biweekly-20260903"></iframe><script>const frame=document.getElementById('app');frame.addEventListener('load',()=>{try{const d=frame.contentDocument;if(!d||d.getElementById('tabBiweekly'))return;const tabs=d.querySelector('.tabs'),serviceTab=d.getElementById('tabService'),servicePage=d.getElementById('servicePage');if(!tabs||!serviceTab||!servicePage)return;const tab=d.createElement('button');tab.className='tab';tab.id='tabBiweekly';tab.textContent='两周结算';serviceTab.insertAdjacentElement('afterend',tab);const page=d.createElement('section');page.className='page';page.id='biweeklyPage';page.innerHTML=`<div class="card"><div class="period-title">两周结算</div><div class="service-note">固定结算周期：每月 1–15 日、16–月底。这里只读取每日总表，不会修改任何数据。</div><div class="actions"><button class="clear" id="prevBiweeklyBtn">← 上一期</button><button class="clear" id="nextBiweeklyBtn">下一期 →</button></div><div class="current-day" id="biweeklyPeriodLabel"></div></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>当日总数</th><th>小费总数</th></tr></thead><tbody id="biweeklyRows"></tbody><tfoot><tr><td>本期累计</td><td id="biweeklySales">$0.00</td><td id="biweeklyTips">$0.00</td></tr></tfoot></table></div><div class="card"><div class="summary"><div class="stat"><span>服务累计</span><b id="biweeklySalesCard">$0.00</b></div><div class="stat"><span>Tips 累计</span><b id="biweeklyTipsCard">$0.00</b></div><div class="stat"><span>本期合计</span><b id="biweeklyAllCard">$0.00</b></div></div></div>`;servicePage.insertAdjacentElement('afterend',page);tabs.style.gridTemplateColumns='repeat(4,1fr)';let anchor='';const money=v=>'$'+Number(v||0).toFixed(2),fmt=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`,today=()=>fmt(new Date());function rows(){const out=[];for(let i=1;i<=16;i++){const dt=d.getElementById('sdate'+i),sv=d.getElementById('ssales'+i),tp=d.getElementById('stips'+i);if(dt&&dt.value)out.push({date:dt.value,sales:Number((sv&&sv.value)||0),tips:Number((tp&&tp.value)||0)})}return out.sort((a,b)=>a.date.localeCompare(b.date))}function bounds(a){const [y,m,day]=a.split('-').map(Number),last=new Date(y,m,0).getDate(),sd=day<=15?1:16,ed=day<=15?15:last;return{start:`${y}-${String(m).padStart(2,'0')}-${String(sd).padStart(2,'0')}`,end:`${y}-${String(m).padStart(2,'0')}-${String(ed).padStart(2,'0')}`}}function shift(a,dir){const [y,m,day]=a.split('-').map(Number);if(dir<0)return day<=15?fmt(new Date(y,m-2,16)):fmt(new Date(y,m-1,1));return day<=15?fmt(new Date(y,m-1,16)):fmt(new Date(y,m,1))}function render(){const all=rows();if(!anchor)anchor=all.length?all[all.length-1].date:today();const b=bounds(anchor),part=all.filter(r=>r.date>=b.start&&r.date<=b.end);let s=0,t=0,h='';part.forEach(r=>{s+=r.sales;t+=r.tips;h+=`<tr><td>${r.date}</td><td>${money(r.sales)}</td><td>${money(r.tips)}</td></tr>`});if(!part.length)h='<tr><td colspan="3" style="padding:24px;color:#756a72">这期目前没有数据</td></tr>';d.getElementById('biweeklyRows').innerHTML=h;d.getElementById('biweeklyPeriodLabel').textContent=b.start+' ～ '+b.end;d.getElementById('biweeklySales').textContent=money(s);d.getElementById('biweeklyTips').textContent=money(t);d.getElementById('biweeklySalesCard').textContent=money(s);d.getElementById('biweeklyTipsCard').textContent=money(t);d.getElementById('biweeklyAllCard').textContent=money(s+t)}function show(){d.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));d.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));page.classList.add('active');tab.classList.add('active');render()}tab.addEventListener('click',show);d.getElementById('prevBiweeklyBtn').addEventListener('click',()=>{if(!anchor)anchor=today();anchor=shift(anchor,-1);render()});d.getElementById('nextBiweeklyBtn').addEventListener('click',()=>{if(!anchor)anchor=today();anchor=shift(anchor,1);render()})}catch(e){console.error(e)}});</script></body></html>
