<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Soulcool Nails 测试版</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f7f4f6;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif}.test-badge{height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#241f23;color:#fff;font-size:12px;font-weight:800;letter-spacing:.7px;line-height:1.4}.test-badge span{opacity:.95}.test-info,.login-status,.sync-state{font-size:11px;font-weight:600;letter-spacing:0;opacity:.9}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#a9a9a9}.state-ok .dot{background:#35b86b}.state-error .dot{background:#d9534f}.state-idle .dot{background:#a9a9a9}iframe{border:0;width:100%;height:calc(100vh - 82px);display:block;background:#f7f4f6}
</style>
</head>
<body>
<div class="test-badge">
  <span>SOULCOOL NAILS · TEST VERSION · 测试版</span>
  <div class="test-info" id="lastSync">最后同步：尚未同步</div>
  <div class="login-status" id="loginStatus">目前登入：尚未登入｜资料未同步</div>
  <div class="sync-state state-idle" id="syncState"><span class="dot"></span>同步状态：尚未同步</div>
</div>
<iframe id="appFrame" src="index.html"></iframe>
<script>
const frame=document.getElementById('appFrame');
const lastSync=document.getElementById('lastSync');
const loginStatus=document.getElementById('loginStatus');
const syncState=document.getElementById('syncState');
let synced=false;
function setState(kind,text){
  syncState.className='sync-state '+(kind==='ok'?'state-ok':kind==='error'?'state-error':'state-idle');
  syncState.innerHTML='<span class="dot"></span>'+text;
}
function stampSync(){
  synced=true;
  lastSync.textContent='最后同步：'+new Date().toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'});
  setState('ok','同步状态：资料已同步');
  updateLoginStatus();
}
function updateLoginStatus(){
  try{
    const doc=frame.contentDocument;
    const label=doc&&doc.getElementById('userLabel');
    const text=(label&&label.textContent||'').trim();
    if(!text||text==='尚未登录'){
      loginStatus.textContent='目前登入：尚未登入｜资料未同步';
      return;
    }
    loginStatus.textContent='目前登入：'+text+'｜'+(synced?'资料已同步':'资料未同步');
  }catch(e){}
}
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const status=doc&&doc.getElementById('summaryStatus');
    const userLabel=doc&&doc.getElementById('userLabel');
    const btn=doc&&doc.getElementById('loadMainBtn');
    const checkSync=()=>{
      const t=(status?.textContent||'');
      if(t.includes('已从 Soulcool 主数据同步')) stampSync();
      else if(t.includes('同步失败')||t.includes('找不到')){
        synced=false;
        setState('error','同步状态：同步失败');
        updateLoginStatus();
      } else if(t.includes('正在从 Soulcool 主数据同步')){
        synced=false;
        setState('idle','同步状态：同步中…');
        updateLoginStatus();
      }
    };
    updateLoginStatus();
    if(status){
      checkSync();
      new MutationObserver(checkSync).observe(status,{childList:true,subtree:true,characterData:true});
    }
    if(userLabel){
      new MutationObserver(updateLoginStatus).observe(userLabel,{childList:true,subtree:true,characterData:true});
    }
    if(btn){
      btn.addEventListener('click',()=>{
        synced=false;
        setState('idle','同步状态：同步中…');
        updateLoginStatus();
        setTimeout(checkSync,1200);
      });
    }
  }catch(e){}
});
</script>
</body>
</html>
